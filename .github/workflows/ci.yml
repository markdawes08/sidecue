name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Record build environment
        shell: pwsh
        run: |
          Write-Output "Runner image: $env:ImageOS / $env:ImageVersion"
          dotnet --info
      - name: Check repository documents
        shell: pwsh
        run: ./tools/check-repository.ps1
      - name: Restore locked dependencies and build
        shell: pwsh
        run: ./tools/build.ps1
      - name: Run deterministic tests
        shell: pwsh
        run: ./tools/test.ps1 -NoBuild
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 7
